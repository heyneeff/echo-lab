<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morpheus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --body: #0b0b0d; --panel: #111114; --rail: #1c1c20; --rail-hi: #26262b; --line: #2e2e34;
  --txt: #e9e6e1; --dim: #6c6a70; --faint: #3a393f;
  --amber: #ffc93c; --orange: #ff8a1f; --red: #ff4a2b; --teal: #2fd6a8; --violet: #a98bff;
  --sans: Montserrat, "Helvetica Neue", Arial, sans-serif;
  --vec: "Share Tech Mono", ui-monospace, monospace;
}
/* a control surface, not a document: no text selection, no dragging images around */
html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
img, canvas, svg { -webkit-user-drag: none; user-drag: none; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: radial-gradient(1200px 800px at 50% 10%, #1a1a1f, #050506); color: var(--txt); font-family: var(--sans); overflow: hidden; }
.bar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font: 11px var(--vec); color: #9a968f; letter-spacing: .14em; }
.bar .hint { color: #5d5a60; } .bar b { color: var(--amber); font-weight: 400; }
#stage { position: absolute; left: 0; right: 0; top: 46px; bottom: 0; display: grid; place-items: center; }
#units { width: 1180px; height: 760px; transform-origin: 50% 50%; position: relative; }
html.host .bar { display: none; } html.host #stage { top: 0; } html.host body { background: #0b0b0d; }

/* ---------------------------------------------------------------- body: dreamscape | rail, mod deck below */
.chassis { position: absolute; inset: 0; border-radius: 22px; background: var(--body); padding: 12px; display: grid;
  grid-template-columns: 660px 1fr; grid-template-rows: 1fr 196px; gap: 12px; box-shadow: 0 40px 80px -20px #000, 0 0 0 1px #ffffff0d inset; }
.hero { position: relative; border-radius: 16px; background: #0d0a09; overflow: hidden; box-shadow: 0 0 0 1px #ffffff08 inset; cursor: crosshair; touch-action: none; }
.hero canvas, .mini canvas, .card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero::after, .mini::after, .card .scr::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: repeating-linear-gradient(0deg, #0000 0 2px, #0000001f 2px 3px), radial-gradient(120% 90% at 50% 45%, #0000 60%, #0009); }
.logo, .axis, .brk, .hud { z-index: 2; }
.logo { position: absolute; left: 40px; top: 30px; pointer-events: none; }
.logo .wmark { display: block; height: 46px; width: auto; filter: drop-shadow(0 0 10px #ffc93c33); }
.logo small { display: block; font: 600 9px var(--sans); letter-spacing: .42em; color: var(--dim); margin-top: 10px; }
.axis { position: absolute; font: 700 10px var(--sans); letter-spacing: .32em; pointer-events: none; }
.axis.y { left: 34px; bottom: 120px; transform: rotate(-90deg); transform-origin: left bottom; }
.axis.x { left: 112px; bottom: 34px; }
.axis b { font: 11px var(--vec); letter-spacing: .08em; color: var(--txt); margin-left: 8px; }
.brk { position: absolute; border-color: #e9e6e1aa; border-style: solid; pointer-events: none; }
.brk.bl { left: 40px; bottom: 40px; width: 60px; height: 70px; border-width: 0 0 2px 2px; border-radius: 0 0 0 6px; }
.brk.tr { right: 40px; top: 40px; width: 60px; height: 70px; border-width: 2px 2px 0 0; border-radius: 0 6px 0 0; }
.hud { position: absolute; right: 44px; bottom: 30px; font: 11px var(--vec); letter-spacing: .14em; color: var(--amber); pointer-events: none; text-align: right; }
.hud span { color: var(--dim); }
.tbtns { position: absolute; right: 44px; top: 124px; z-index: 3; display: grid; gap: 8px; justify-items: end; }
.tbtn { font: 10px var(--vec); letter-spacing: .14em; color: var(--amber); background: #141417cc;
  border: 1px solid #ff8a1f44; border-radius: 6px; padding: 6px 10px; cursor: pointer; display: none; }
.tbtn:hover { border-color: #ffc93caa; box-shadow: 0 0 12px #ffc93c33; } .tbtn.show { display: block; }
.tbtn.load { display: block; color: #8ff0d2; border-color: #2fd6a866; } .tbtn.load:hover { border-color: #2fd6a8; box-shadow: 0 0 12px #2fd6a855; }
.hero .dropzone { position: absolute; inset: 14px; z-index: 4; border: 2px dashed #ffc93c; border-radius: 12px; display: none; place-items: center; text-align: center;
  font: 13px var(--vec); letter-spacing: .22em; color: var(--amber); background: #0d0a09cc; pointer-events: none; text-shadow: 0 0 12px #ffc93c88; }
.hero .dropzone small { display: block; margin-top: 10px; font-size: 10px; color: var(--dim); letter-spacing: .14em; }
body.dragging .hero .dropzone, .hero.growing .dropzone { display: grid; }
.hero.growing .dropzone { border-style: solid; animation: grow 1.2s ease-in-out infinite; }
@keyframes grow { 50% { border-color: #2fd6a8; color: #8ff0d2; } }

.rail { position: relative; border-radius: 16px; background: linear-gradient(180deg, var(--rail-hi), var(--rail)); box-shadow: 0 0 0 1px #ffffff0a inset;
  display: grid; grid-template-rows: 38px auto auto auto 1fr; gap: 12px; padding: 0 0 12px; overflow: hidden; }
.preset { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; background: #0f0f12; border-bottom: 1px solid #ffffff0a; }
.preset .nm { font: 700 11px var(--sans); letter-spacing: .26em; }
.preset .pn { flex: 1; font: 10px var(--vec); color: var(--amber); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
.pbtn { width: 26px; height: 26px; border-radius: 6px; background: #1d1d22; border: 1px solid #ffffff12; color: var(--txt); display: grid; place-items: center; cursor: pointer; font-size: 11px; }
.row { display: flex; justify-content: space-around; align-items: flex-start; padding: 0 12px; }
.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 12px; }
.mini { position: relative; height: 200px; border-radius: 10px; background: #0d0a09; box-shadow: 0 0 0 1px #ffffff0a inset; overflow: hidden; }
.g6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px 0; padding: 0 6px; }
.pmenu { position: absolute; left: 0; right: 0; top: 38px; bottom: 0; z-index: 5; display: none; align-content: start; gap: 6px; padding: 14px 14px 18px;
  background: rgba(13,10,9,.96); backdrop-filter: blur(4px); overflow: auto; border-top: 1px solid #ff8a1f33; }
.pmenu.open { display: grid; }
.pmenu button { font: 12px var(--vec); letter-spacing: .1em; text-align: left; color: #ffd27a; background: #141417; border: 1px solid #ff8a1f2e;
  padding: 10px 12px; border-radius: 7px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.pmenu button small { color: var(--dim); font-size: 10px; letter-spacing: .06em; }
.pmenu button:hover { border-color: #ffc93c99; box-shadow: 0 0 12px #ffc93c33; color: #fff1c9; }
.pmenu button.flag { border-color: #2fd6a866; color: #8ff0d2; }

/* mod deck: sources own their routes */
.deck { grid-column: 1 / 3; display: grid; grid-template-columns: 1.45fr 1.75fr 92px 200px; gap: 12px; }
.card { position: relative; border-radius: 16px; background: linear-gradient(180deg, var(--rail-hi), var(--rail)); box-shadow: 0 0 0 1px #ffffff0a inset;
  display: grid; grid-template-rows: 22px 1fr; padding: 10px 12px 8px; gap: 6px; min-width: 0; }
.card h3 { margin: 0; font: 700 9px var(--sans); letter-spacing: .32em; display: flex; justify-content: space-between; align-items: center; }
.card h3 i { font: 9px var(--vec); font-style: normal; letter-spacing: .1em; color: var(--dim); }
.card .body { display: grid; grid-template-columns: minmax(120px, 1fr) auto; gap: 10px; min-height: 0; align-items: stretch; }
.card .ks .knob .name { font-size: 7.5px; letter-spacing: .1em; }
.card .ks { align-self: center; }
.card .scr { position: relative; height: 100%; min-height: 0; border-radius: 10px; background: #0d0a09; box-shadow: 0 0 0 1px #ffffff0a inset; overflow: hidden; }
.card .ks { display: grid; grid-auto-flow: column; gap: 8px; align-items: start; }
.routes { display: grid; grid-auto-flow: column; gap: 4px; padding-left: 10px; border-left: 1px solid #ffffff10; margin-left: 2px; }
.foot { display: grid; grid-template-columns: 1fr 78px; align-items: center; gap: 10px; }

/* knobs: dark cap inside a glowing arc; modulation shows as an outer ring in the source's colour */
.knob { display: grid; justify-items: center; gap: 3px; user-select: none; -webkit-user-select: none; touch-action: none; }
.knob .dial { position: relative; cursor: ns-resize; }
.knob svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.knob .cap { position: absolute; inset: 24%; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #6b6b72, #36363c 55%, #1d1d21);
  box-shadow: 0 6px 12px -2px #000c, 0 0 0 3px #141417, 0 0 0 4px #ffffff0d; }
.knob .ptr { position: absolute; left: 50%; top: 10%; width: 2px; height: 34%; margin-left: -1px; background: #f4f1ea; border-radius: 1px; transform-origin: 50% 118%; }
.knob .name { font: 700 8px var(--sans); letter-spacing: .14em; white-space: nowrap; }

<script>
// a control surface, not a document: never start a text selection or drag an element out of the face
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());
// ===================================================================== plugin or browser?
// Inside the plugin (WKWebView) the page talks to the real synth: window.__host(json) brings parameters,
// voices and meters; knob moves go back as {type:"param", name, value} (plain values, names as in params.h).
// In a browser the page is a playable preview (computer keyboard, Web Audio).
const HOST = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lab);
if (HOST) document.documentElement.classList.add("host");
const $ = s => document.querySelector(s);
const COL = { amber: "#ffc93c", orange: "#ff8a1f", red: "#ff4a2b", teal: "#2fd6a8", violet: "#a98bff", white: "#e9e6e1" };
const VF = "'Share Tech Mono', ui-monospace, monospace";
const log = m => { if (HOST) window.webkit.messageHandlers.lab.postMessage({ type: "log", msg: String(m) }); else console.log(m); };

// ===================================================================== parameters (plain values; mirror plugin/synth/params.h)
const DEF = { "Position": 40, "Unison": 1, "Detune": 15, "Spread": 60, "Sub": 0, "Cutoff": 20000, "Resonance": 10, "Filter Env": 0, "Position Env": 0,
  "Attack": 3, "Decay": 300, "Sustain": 80, "Release": 300, "Mod Attack": 3, "Mod Decay": 600, "Velocity": 60, "Drive": 0, "Output": 0 };
const P = { ...DEF };
const K = {};
let userEdit = 0;
function setParam(name, v) { P[name] = v; userEdit = performance.now(); if (HOST) window.webkit.messageHandlers.lab.postMessage({ type: "param", name, value: v }); }

// ===================================================================== formatting
const ms = v => v < 1000 ? (v < 10 ? v.toFixed(1) : v.toFixed(0)) + " ms" : (v / 1000).toFixed(2) + " s";
const hz = v => v < 1000 ? v.toFixed(0) + " Hz" : (v / 1000).toFixed(2) + " kHz";
const pct = v => v.toFixed(0) + " %", spct = v => (v > 0 ? "+" : "") + v.toFixed(0) + " %";
const dB = v => (v > 0 ? "+" : "") + v.toFixed(1) + " dB";

// ===================================================================== knob
function knob(parent, { name, min, max, log: lg, size = 44, color = COL.amber, fmt, step, mod }) {
  const el = document.createElement("div"); el.className = "knob" + (size > 70 ? " big" : "");
  el.innerHTML = `<div class="dial" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"></svg><div class="cap"><div class="ptr"></div></div></div><div class="name" style="color:${color};text-shadow:0 0 10px ${color}55">${name.toUpperCase()}</div><div class="val"></div>`;
  parent.appendChild(el);
  const svg = el.querySelector("svg"), ptr = el.querySelector(".ptr"), val = el.querySelector(".val");
  const Pt = (deg, r) => [50 + Math.sin(deg * Math.PI / 180) * r, 50 - Math.cos(deg * Math.PI / 180) * r];
  const arc = (a0, a1, r) => { if (a1 < a0) [a0, a1] = [a1, a0]; const [x0, y0] = Pt(a0, r), [x1, y1] = Pt(a1, r); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
  const toN = v => lg ? Math.log(v / min) / Math.log(max / min) : (v - min) / (max - min);
  const fromN = n => { let v = lg ? min * Math.pow(max / min, n) : min + n * (max - min); return step ? Math.round(v / step) * step : v; };
  let n = toN(P[name]), drag = null;
  const paint = (silent) => {
    const a = -135 + 270 * n;
    let dots = ""; for (let i = 0; i <= 8; i++) { const d = -135 + 270 * i / 8, [x, y] = Pt(d, 49); dots += `<circle cx="${x}" cy="${y}" r="1.6" fill="${d <= a + .1 ? color : "#4a4950"}"/>`; }
    let ring = "";
    if (mod) for (const m of mod()) {  // modulation range from the current value, in the source's colour
      if (Math.abs(m.amt) < .002) continue;
      const b = Math.max(0, Math.min(1, n + m.amt)), a0 = -135 + 270 * n, a1 = -135 + 270 * b;
      ring += `<path d="${arc(a0, a1, 45)}" stroke="${m.col}" stroke-width="3" fill="none" stroke-linecap="round" opacity=".95" style="filter:drop-shadow(0 0 3px ${m.col})"/>`;
    }
    svg.innerHTML = `<path d="${arc(-135, 135, 37)}" stroke="#2c2c32" stroke-width="5" fill="none" stroke-linecap="round"/>` +
      (n > .002 ? `<path d="${arc(-135, a, 37)}" stroke="${color}" stroke-width="5" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 4px ${color})"/>` : "") + ring + dots;
    ptr.style.transform = `rotate(${a}deg)`;
    const v = fromN(n); val.textContent = fmt ? fmt(v) : v.toFixed(0);
    if (!silent) setParam(name, v);
  };
  const dial = el.querySelector(".dial");
  dial.addEventListener("pointerdown", e => { e.preventDefault(); drag = { y: e.clientY, n }; dial.setPointerCapture(e.pointerId); });
  dial.addEventListener("pointermove", e => { if (!drag) return; n = Math.min(1, Math.max(0, drag.n + (drag.y - e.clientY) / (e.shiftKey ? 700 : 200))); paint(); repaintMods(); });
  dial.addEventListener("pointerup", () => drag = null); dial.addEventListener("pointercancel", () => drag = null); dial.addEventListener("lostpointercapture", () => drag = null);
  dial.addEventListener("dblclick", () => { n = toN(DEF[name]); paint(); repaintMods(); });
  dial.addEventListener("wheel", e => { e.preventDefault(); n = Math.min(1, Math.max(0, n - e.deltaY / 900)); paint(); repaintMods(); }, { passive: false });
  paint(true);
  return K[name] = { el, set(v, silent) { n = Math.min(1, Math.max(0, toN(v))); paint(silent); }, repaint() { paint(true); }, norm: () => n };
}
// rings that depend on another knob (e.g. Position Env drawn on Position) repaint when that knob moves
const repaintMods = () => { K["Position"] && K["Position"].repaint(); K["Cutoff"] && K["Cutoff"].repaint(); };
const CUT_OCT = Math.log2(20000 / 20);

// ===================================================================== layout
knob($("#big"), { name: "Position", min: 0, max: 100, size: 84, color: COL.amber, fmt: v => "FRAME " + (1 + Math.round(v / 100 * 63)),
  mod: () => [{ amt: P["Position Env"] / 100, col: COL.violet }] });
knob($("#big"), { name: "Cutoff", min: 20, max: 20000, log: true, size: 84, color: COL.orange, fmt: hz,
  mod: () => [{ amt: P["Filter Env"] / 100 * 6 / CUT_OCT, col: COL.violet }] });
knob($("#big"), { name: "Unison", min: 1, max: 7, step: 1, size: 84, color: COL.teal, fmt: v => v + (v > 1 ? " VOICES" : " VOICE") });
const sm = $("#small");
knob(sm, { name: "Detune", min: 0, max: 100, color: COL.teal, fmt: v => v.toFixed(0) + " ct" });
knob(sm, { name: "Spread", min: 0, max: 100, color: COL.teal, fmt: pct });
knob(sm, { name: "Resonance", min: 0, max: 100, color: COL.orange, fmt: pct });
knob(sm, { name: "Sub", min: 0, max: 100, color: COL.amber, fmt: pct });
knob(sm, { name: "Drive", min: 0, max: 10, color: COL.red, fmt: v => v < .005 ? "OFF" : v.toFixed(1) });
knob(sm, { name: "Output", min: -24, max: 12, color: COL.white, fmt: dB });
for (const [nm, mn, mx, f] of [["Attack", .5, 10000, ms], ["Decay", 5, 10000, ms], ["Sustain", 0, 100, pct], ["Release", 5, 10000, ms]])
  knob($("#ampK"), { name: nm, min: mn, max: mx, log: nm !== "Sustain", color: COL.teal, fmt: f });
knob($("#modK"), { name: "Mod Attack", min: .5, max: 10000, log: true, color: COL.violet, fmt: ms });
knob($("#modK"), { name: "Mod Decay", min: 5, max: 10000, log: true, color: COL.violet, fmt: ms });
knob($("#modR"), { name: "Position Env", min: -100, max: 100, color: COL.violet, fmt: spct });
knob($("#modR"), { name: "Filter Env", min: -100, max: 100, color: COL.violet, fmt: spct });
$("#modR").children[0].querySelector(".name").textContent = "→ POSITION";
$("#modR").children[1].querySelector(".name").textContent = "→ CUTOFF";
knob($("#velK"), { name: "Velocity", min: 0, max: 100, size: 64, color: COL.red, fmt: pct });

// ===================================================================== the wavetable (same spectra as dsp/WavetableSynth.h)
const NF = 64, NP = 128;
function amp(f, h) {
  const seg = Math.floor(f / 16), t = (f % 16) / 15;

});
addEventListener("keyup", e => { const v = down.get(e.key); if (!v) return; down.delete(e.key);
  const now = performance.now() / 1000, en = envAt(v, now); v.lvlOff = en.a; v.modOff = en.m; v.toff = now; audioOff(v.nodes); });
function simulate() {
  const now = performance.now() / 1000; voices = [];
  for (let i = sim.length - 1; i >= 0; i--) { const v = sim[i], en = envAt(v, now);
    if (v.toff != null && en.a < .002) { sim.splice(i, 1); continue; }
    voices.push({ note: v.note, pos: Math.max(0, Math.min(1, P["Position"] / 100 + P["Position Env"] / 100 * en.m)), amp: en.a, mod: en.m }); }
  outLevel = Math.max(outLevel * .9, voices.reduce((s, v) => s + v.amp * .25, 0));
}

// ===================================================================== loop
function frame() {
  const now = performance.now() / 1000;
  drawLand(now); drawFrame(); drawFilt(); drawMeter();
  drawEnv("#ampView", P["Attack"] / 1000, P["Decay"] / 1000, P["Sustain"] / 100, P["Release"] / 1000, COL.teal, "a");
  drawEnv("#modView", P["Mod Attack"] / 1000, P["Mod Decay"] / 1000, 0, P["Release"] / 1000, COL.violet, "m");
  $("#ampInfo").textContent = `${voices.filter(v => v.amp > .01).length} / 16`;
}
function loop() { simulate(); frame(); requestAnimationFrame(loop); }
const scaleNow = () => HOST ? Math.min(innerWidth / 1180, innerHeight / 760) : Math.min(innerWidth / 1210, (innerHeight - 52) / 780, 1.25);
function scaleUnits() { $("#units").style.transform = `scale(${scaleNow()})`; }
addEventListener("resize", scaleUnits); scaleUnits();
if (!HOST) requestAnimationFrame(loop); else frame();
</script>
</body></html>
