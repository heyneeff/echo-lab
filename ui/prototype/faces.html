<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oread & Prometheus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --body: #0b0b0d; --panel: #111114; --rail: #1c1c20; --rail-hi: #26262b; --line: #2e2e34;
  --txt: #e9e6e1; --dim: #6c6a70; --faint: #3a393f;
  --amber: #ffc93c; --orange: #ff8a1f; --red: #ff4a2b; --teal: #2fd6a8; --violet: #a98bff;
  --sans: Montserrat, "Helvetica Neue", Arial, sans-serif;
  --vec: "Share Tech Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: radial-gradient(1200px 800px at 50% 10%, #1a1a1f, #050506); color: var(--txt); font-family: var(--sans); overflow: hidden; }
.bar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font: 11px var(--vec); color: #9a968f; letter-spacing: .14em; }
.bar .grp { display: flex; gap: 6px; align-items: center; }
.bar button, .bar label.btn { font: 11px var(--vec); letter-spacing: .14em; color: #d9d4cc; background: #141417; border: 1px solid #2c2c32; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.bar button.on { color: #0b0b0d; background: var(--amber); border-color: var(--amber); }
.bar .sp { flex: 1; } .bar .hint { color: #5d5a60; }
#stage { position: absolute; left: 0; right: 0; top: 46px; bottom: 0; display: grid; place-items: center; }
#units { width: 1060px; height: 640px; transform-origin: 50% 50%; position: relative; }
.unit { position: absolute; inset: 0; display: none; } .unit.show { display: block; }
.drop { position: fixed; inset: 0; background: #000a; display: none; place-items: center; font: 20px var(--vec); color: var(--amber); letter-spacing: .2em; z-index: 9; }
body.dragging .drop { display: grid; }

/* ---------------------------------------------------------------- body */
.chassis { position: absolute; inset: 0; border-radius: 22px; background: var(--body); padding: 12px; display: grid; grid-template-columns: 616px 1fr; gap: 12px;
  box-shadow: 0 40px 80px -20px #000, 0 0 0 1px #ffffff0d inset; }
.hero { position: relative; border-radius: 16px; background: #0d0a09; overflow: hidden; box-shadow: 0 0 0 1px #ffffff08 inset; cursor: crosshair; touch-action: none; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero::after, .mini::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; background: repeating-linear-gradient(0deg, #0000 0 2px, #0000001f 2px 3px), radial-gradient(120% 90% at 50% 45%, #0000 60%, #0009); }
.logo, .axis, .brk { z-index: 2; }
.logo { position: absolute; left: 40px; top: 30px; font: 800 30px/1 var(--sans); letter-spacing: .2em; pointer-events: none; }
.logo .o { display: inline-block; width: .78em; height: .78em; border-radius: 50%; border: .12em solid; vertical-align: -.02em; margin: 0 .03em; }
.logo small { display: block; font: 600 9px var(--sans); letter-spacing: .42em; color: var(--dim); margin-top: 8px; }
.axis { position: absolute; font: 700 10px var(--sans); letter-spacing: .32em; pointer-events: none; }
.axis.y { left: 34px; bottom: 120px; transform: rotate(-90deg); transform-origin: left bottom; }
.axis.x { left: 112px; bottom: 34px; }
.axis b { font: 11px var(--vec); letter-spacing: .08em; color: var(--txt); margin-left: 8px; }
.brk { position: absolute; border-color: #e9e6e1aa; border-style: solid; pointer-events: none; }
.brk.bl { left: 40px; bottom: 40px; width: 60px; height: 70px; border-width: 0 0 2px 2px; border-radius: 0 0 0 6px; }
.brk.tr { right: 40px; top: 40px; width: 60px; height: 70px; border-width: 2px 2px 0 0; border-radius: 0 6px 0 0; }

/* ---------------------------------------------------------------- rail */
.rail { border-radius: 16px; background: linear-gradient(180deg, var(--rail-hi), var(--rail)); box-shadow: 0 0 0 1px #ffffff0a inset; display: grid; grid-template-rows: 38px auto 1fr auto auto auto; gap: 10px; padding: 0 0 12px; overflow: hidden; }
.preset { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; background: #0f0f12; border-bottom: 1px solid #ffffff0a; }
.preset .nm { flex: 1; font: 700 11px var(--sans); letter-spacing: .26em; }
.pbtn { width: 26px; height: 26px; border-radius: 6px; background: #1d1d22; border: 1px solid #ffffff12; color: var(--txt); display: grid; place-items: center; cursor: pointer; font-size: 11px; }
.seg { display: flex; background: #0f0f12; border-radius: 7px; padding: 2px; border: 1px solid #ffffff0d; }
.seg button { font: 700 8.5px var(--sans); letter-spacing: .18em; color: var(--dim); background: transparent; border: 0; padding: 6px 8px; border-radius: 5px; cursor: pointer; }
.seg button.on { background: #2a2a31; color: var(--txt); box-shadow: 0 0 0 1px #ffffff14 inset; }
.row { display: flex; justify-content: space-around; align-items: flex-start; padding: 0 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 4px; padding: 0 10px; }
.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 12px; min-height: 0; }
.mini { position: relative; min-height: 110px; border-radius: 10px; background: #0d0a09; box-shadow: 0 0 0 1px #ffffff0a inset; overflow: hidden; }
.mini canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* knobs: Portal-style dark cap inside a glowing arc */
.knob { display: grid; justify-items: center; gap: 3px; user-select: none; -webkit-user-select: none; touch-action: none; }
.knob .dial { position: relative; cursor: ns-resize; }
.grid4 .knob .val { font-size: 9px; } .grid4 { gap: 2px 4px; }
.grid4.g6 { grid-template-columns: repeat(6, 1fr); gap: 6px 0; padding: 0 6px; }
.grid4.g6 .knob .name { font-size: 8px; letter-spacing: .14em; }
.knob svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.knob .cap { position: absolute; inset: 24%; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #6b6b72, #36363c 55%, #1d1d21);
  box-shadow: 0 6px 12px -2px #000c, 0 0 0 3px #141417, 0 0 0 4px #ffffff0d; }
.knob .ptr { position: absolute; left: 50%; top: 10%; width: 2px; height: 34%; margin-left: -1px; background: #f4f1ea; border-radius: 1px; transform-origin: 50% 118%; }
.knob .name { font: 700 9px var(--sans); letter-spacing: .26em; white-space: nowrap; }
.knob.big .name { font-size: 11px; letter-spacing: .3em; }
.knob .val { font: 10px var(--vec); color: var(--dim); }

/* mix slider */
.mix { display: grid; grid-template-columns: 22px 1fr 22px; align-items: center; gap: 8px; padding: 0 14px; }
.mix span { font: 700 8px var(--sans); letter-spacing: .2em; color: var(--dim); writing-mode: vertical-rl; transform: rotate(180deg); justify-self: center; }
.mix .trk { position: relative; height: 40px; border-radius: 8px; background: #0b0b0e; box-shadow: inset 0 2px 6px #000, 0 0 0 1px #ffffff0a; cursor: ew-resize; overflow: hidden; touch-action: none; }
.mix canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.mix .hd { position: absolute; top: 3px; bottom: 3px; width: 14px; margin-left: -7px; border-radius: 4px; background: linear-gradient(90deg, #3d3d44, #6e6e76, #3d3d44); box-shadow: 0 2px 6px #000; }
.foot { display: flex; align-items: flex-end; gap: 12px; padding: 0 14px; }
.foot .wm { flex: 1; font: 800 15px var(--sans); letter-spacing: .24em; color: #3a3a41; line-height: 1.1; }
.foot .wm small { display: block; font: 600 8px var(--sans); letter-spacing: .34em; color: #333339; }
.meters { width: 78px; height: 74px; position: relative; }
.meters canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* punish: a rail control like the knobs, with Prometheus' flame; arm, then fire */
.pun { display: grid; justify-items: center; gap: 3px; cursor: pointer; user-select: none; -webkit-user-select: none; }
.pun .pdial { position: relative; width: 84px; height: 84px; }
.pun svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pun .ring-track { fill: none; stroke: #2c2c32; stroke-width: 5; }
.pun .ring-on { fill: none; stroke: var(--red); stroke-width: 5; stroke-linecap: round; opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity .15s; }
.pun .pdots circle { fill: #4a4950; transition: fill .15s; }
.pun .pcap { position: absolute; inset: 24%; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 30%, #6b6b72, #36363c 55%, #1d1d21);
  box-shadow: 0 6px 12px -2px #000c, 0 0 0 3px #141417, 0 0 0 4px #ffffff0d; transition: box-shadow .2s; }
.pun .pcap svg { width: 52%; height: 52%; overflow: visible; }
.pun .flame { fill: #4a4950; transition: fill .15s, filter .15s; }
.pun .flame-core { fill: #2a2a2f; transition: fill .15s; }
.pun .name { font: 700 11px var(--sans); letter-spacing: .3em; color: var(--red); text-shadow: 0 0 10px #ff4a2b55; }
.pun .val { font: 10px var(--vec); color: var(--dim); }
.pun.armed .ring-on { opacity: 1; stroke-dasharray: 5 8; animation: pspin 1.6s linear infinite; }
.pun.armed .flame { fill: var(--orange); filter: drop-shadow(0 0 4px #ff8a1f); }
.pun.armed .val { color: var(--orange); animation: pblink .5s steps(2) infinite; }
.pun.on .ring-on { opacity: 1; filter: drop-shadow(0 0 5px var(--red)); }
.pun.on .pdots circle { fill: var(--red); }
.pun.on .flame { fill: var(--red); filter: drop-shadow(0 0 8px var(--red)); }
.pun.on .flame-core { fill: #ffc93c; }
.pun.on .pcap { box-shadow: 0 6px 12px -2px #000c, 0 0 0 3px #141417, 0 0 22px #ff4a2b66, inset 0 0 14px #ff4a2b44; }
.pun.on .val { color: var(--red); }
.pun:active .pcap { transform: scale(.97); }
@keyframes pspin { to { transform: rotate(360deg); } }
@keyframes pblink { 50% { opacity: .35; } }
html.host .bar { display: none; }
html.host #stage { top: 0; }
html.host body { background: #0b0b0d; }
</style>
</head>
<body>
<div class="bar">
  <span>SOURCE</span>
  <div class="grp"><button id="srcDemo">DEMO</button><label class="btn" for="fileIn">FILE…</label><input id="fileIn" type="file" accept="audio/*" hidden><button id="srcMic">MIC</button><button id="srcStop">■ STOP</button></div>
  <span class="hint" id="srcName">drop any audio file on the page</span>
  <span class="sp"></span>
  <span>CHAIN</span>
  <div class="grp"><button id="useDrive" class="on">DRIVE</button><span>→</span><button id="useEcho" class="on">ECHO</button></div>
  <span class="sp"></span>
  <div class="grp"><button id="showEcho" class="on">OREAD ECHO</button><button id="showDrive">PROMETHEUS DRIVE</button></div>
</div>
<div id="stage"><div id="units">

  <!-- ============================================================ ECHO LAB -->
  <section class="unit show" id="echo"><div class="chassis">
    <div class="hero" id="echoHero">
      <canvas id="ring"></canvas>
      <div class="logo"><span class="o" style="border-color:var(--teal);box-shadow:0 0 10px #2fd6a8aa, inset 0 0 6px #ffc93c88"></span>READ<small>ECHO · TAPE LOOP · DELAY</small></div>
      <div class="brk tr"></div><div class="brk bl"></div>
      <div class="axis y" style="color:var(--amber)">FEEDBACK<b id="axFb"></b></div>
      <div class="axis x" style="color:var(--teal)">TIME<b id="axTime"></b></div>
    </div>
    <div class="rail">
      <div class="preset"><span class="nm" id="eStyleName"></span><div class="pbtn" id="ePrev">◁</div><div class="pbtn" id="eNext">▷</div></div>
      <div class="row" id="eBig"></div>
      <div class="minis"><div class="mini"><canvas id="ladder"></canvas></div><div class="mini"><canvas id="duckScope"></canvas></div></div>
      <div class="grid4 g6" id="eSmall"></div>
      <div class="mix" id="eMix"><span>DRY</span><div class="trk"><canvas></canvas><div class="hd"></div></div><span>WET</span></div>
      <div class="foot"><div><div class="seg" id="eModes"></div></div><div class="wm">OREAD<small>ECHO · ΗΧΩ</small></div><div class="meters"><canvas id="mE"></canvas></div></div>
    </div>
  </div></section>

  <!-- ============================================================ DRIVE LAB -->
  <section class="unit" id="drive"><div class="chassis">
    <div class="hero" id="driveHero">
      <canvas id="curve"></canvas>
      <div class="logo">PROMETHEUS<small>DRIVE · SATURATION · PUNISHMENT</small></div>
      <div class="brk tr"></div><div class="brk bl"></div>
      <div class="axis y" style="color:var(--amber)">TONE<b id="axTone"></b></div>
      <div class="axis x" style="color:var(--red)">DRIVE<b id="axDrive"></b></div>
    </div>
    <div class="rail">
      <div class="preset"><span class="nm" id="dStyleName"></span><div class="pbtn" id="dPrev">◁</div><div class="pbtn" id="dNext">▷</div></div>
      <div class="row" id="dBig"></div>
      <div class="minis"><div class="mini"><canvas id="harm"></canvas></div><div class="mini"><canvas id="scope"></canvas></div></div>
      <div class="grid4" id="dSmall"></div>
      <div class="mix" id="dMix"><span>DRY</span><div class="trk"><canvas></canvas><div class="hd"></div></div><span>WET</span></div>
      <div class="foot"><div style="display:grid;gap:6px"><div class="seg" id="dRates"></div><div class="seg" id="dAuto"></div></div><div class="wm">PROMETHEUS<small>DRIVE · ΠΡΟΜΗΘΕΥΣ</small></div><div class="meters"><canvas id="mD"></canvas></div></div>
    </div>
  </div></section>
</div></div>
<div class="drop">DROP AUDIO TO RUN IT THROUGH</div>
<script>
// ===================================================================== plugin or browser?
// Inside the plugin (WKWebView) the page talks to the real DSP: window.__host(json) brings meters,
// curves and parameter values; edits go back via webkit.messageHandlers.lab.postMessage.
const HOST = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lab);
const UNIT = window.__UNIT || null;
let userEdit = 0, H = null, hostReady = false;
// WebKit doesn't fire animation frames inside a plugin window, so the plugin face runs on a timer
const nextFrame = f => HOST ? setTimeout(f, 16) : requestAnimationFrame(f);
if (HOST) document.documentElement.classList.add("host");
// ===================================================================== helpers
const $ = s => document.querySelector(s);
const ms = v => v >= 1000 ? (v / 1000).toFixed(2) + " s" : v.toFixed(0) + " ms";
const dB = v => (v > 0 ? "+" : "") + v.toFixed(1) + " dB";
const hz = v => v < 1000 ? v.toFixed(0) + " Hz" : (v / 1000).toFixed(1) + " kHz";
const COL = { amber: "#ffc93c", orange: "#ff8a1f", red: "#ff4a2b", teal: "#2fd6a8", violet: "#a98bff", white: "#e9e6e1" };
// Portal-style knob: dark cap, dotted scale, glowing value arc in the knob's colour
function knob(parent, { name, min, max, value, fmt, size = 44, log, color = COL.amber, onchange }) {
  const el = document.createElement("div"); el.className = "knob" + (size > 70 ? " big" : "");
  el.innerHTML = `<div class="dial" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"></svg><div class="cap"><div class="ptr"></div></div></div><div class="name" style="color:${color};text-shadow:0 0 10px ${color}55">${name}</div><div class="val"></div>`;
  parent.appendChild(el);
  const svg = el.querySelector("svg"), ptr = el.querySelector(".ptr"), val = el.querySelector(".val");
  const P = (deg, r) => [50 + Math.sin(deg * Math.PI / 180) * r, 50 - Math.cos(deg * Math.PI / 180) * r];
  const arc = (a0, a1, r) => { const [x0, y0] = P(a0, r), [x1, y1] = P(a1, r); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
  const toN = v => log ? Math.log(v / min) / Math.log(max / min) : (v - min) / (max - min);
  const fromN = n => log ? min * Math.pow(max / min, n) : min + n * (max - min);
  let n = toN(value), drag = null;
  const paint = (silent) => {
    const a = -135 + 270 * n;
    let dots = ""; for (let i = 0; i <= 8; i++) { const d = -135 + 270 * i / 8, [x, y] = P(d, 49); dots += `<circle cx="${x}" cy="${y}" r="1.6" fill="${d <= a + .1 ? color : "#4a4950"}"/>`; }
    svg.innerHTML = `<path d="${arc(-135, 135, 39)}" stroke="#2c2c32" stroke-width="5" fill="none" stroke-linecap="round"/>` +
      (n > .002 ? `<path d="${arc(-135, a, 39)}" stroke="${color}" stroke-width="5" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 4px ${color})"/>` : "") + dots;
    ptr.style.transform = `rotate(${a}deg)`;
    const v = fromN(n); val.textContent = fmt ? fmt(v) : v.toFixed(0); if (!silent && onchange) onchange(v);
  };
  const dial = el.querySelector(".dial");
  dial.addEventListener("pointerdown", e => { drag = { y: e.clientY, n }; dial.setPointerCapture(e.pointerId); });
  dial.addEventListener("pointermove", e => { if (!drag) return; userEdit = performance.now(); n = Math.min(1, Math.max(0, drag.n + (drag.y - e.clientY) / (e.shiftKey ? 700 : 200))); paint(); });
  dial.addEventListener("pointerup", () => drag = null);
  dial.addEventListener("dblclick", () => { n = toN(value); paint(); });
  dial.addEventListener("wheel", e => { e.preventDefault(); n = Math.min(1, Math.max(0, n - e.deltaY / 900)); paint(); }, { passive: false });
  paint();
  return { set(v, silent) { n = Math.min(1, Math.max(0, toN(v))); paint(silent); }, norm: () => n };
}
function seg(parent, names, cur, onpick) {
  parent.innerHTML = names.map((nm, i) => `<button class="${i === cur ? "on" : ""}" data-i="${i}">${nm}</button>`).join("");
  parent.addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (!b) return; parent.querySelectorAll("button").forEach(k => k.classList.toggle("on", k === b)); onpick(+b.dataset.i); });
}
// Portal-style dry/wet slider with a little particle field
function mixSlider(root, value, color, onchange) {
  const trk = root.querySelector(".trk"), hd = root.querySelector(".hd"), cv = root.querySelector("canvas"); let v = value / 100;
  const paint = () => { hd.style.left = (8 + v * (trk.clientWidth - 16)) + "px"; onchange(v * 100); };
  let drag = false;
  const at = e => { userEdit = performance.now(); const r = trk.getBoundingClientRect(), sc = r.width / trk.clientWidth; v = Math.min(1, Math.max(0, ((e.clientX - r.left) / sc - 8) / (trk.clientWidth - 16))); paint(); };
  trk.addEventListener("pointerdown", e => { drag = true; trk.setPointerCapture(e.pointerId); at(e); });
  trk.addEventListener("pointermove", e => drag && at(e)); trk.addEventListener("pointerup", () => drag = false);
  nextFrame(paint);
  const dots = Array.from({ length: 70 }, () => [Math.random(), Math.random(), Math.random()]);
  return { set(x) { v = x / 100; hd.style.left = (8 + v * (trk.clientWidth - 16)) + "px"; }, draw(now, energy) { const [g, W, H] = fit(cv); const x1 = 8 + v * (W - 16);
    for (const [x, y, s] of dots) { const px = 4 + ((x + now * .03 * (s + .3)) % 1) * (W - 8); if (px > x1) continue; g.fillStyle = color; g.globalAlpha = .25 + .6 * s * Math.min(1, .3 + energy * 4); g.fillRect(px, 6 + y * (H - 12), 1.6, 1.6); }
    g.globalAlpha = 1; } };
}
function fit(c) { const d = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight; if (c.width !== Math.round(W * d) || c.height !== Math.round(H * d)) { c.width = Math.round(W * d); c.height = Math.round(H * d); } const g = c.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, W, H); return [g, W, H]; }
function scaleUnits() { const s = HOST ? Math.min(innerWidth / 1060, innerHeight / 640) : Math.min(innerWidth / 1090, (innerHeight - 52) / 660, 1.35); $("#units").style.transform = `scale(${s})`; }
addEventListener("resize", scaleUnits); scaleUnits();
const VF = "'Share Tech Mono', ui-monospace, monospace";
function glow(g, col, blur = 10) { g.strokeStyle = col; g.fillStyle = col; g.shadowColor = col; g.shadowBlur = blur; }
function text(g, s, x, y, col, size = 11, align = "left") { g.font = size + "px " + VF; g.textAlign = align; glow(g, col, 8); g.fillText(s, x, y); g.shadowBlur = 0; g.textAlign = "left"; }
const heat = h => { const s = [[255, 236, 190], [255, 201, 60], [255, 138, 31], [255, 74, 43], [120, 26, 16]]; const x = Math.min(3.999, Math.max(0, h) * 4), i = Math.floor(x), f = x - i; return s[i].map((v, k) => Math.round(v + (s[i + 1][k] - v) * f)); };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
// slim vector meters (IN / OUT), segmented, with dB readouts
function meters(id, a, b, la, lb) {
  const [g, W, H] = fit(document.getElementById(id)); const seg = 16;
  [[a, la, 12], [b, lb, W / 2 + 6]].forEach(([lvl, label, x]) => {
    const db = 20 * Math.log10(Math.max(lvl, 1e-5)), lit = Math.max(0, Math.min(1, (db + 48) / 48)) * seg, bw = 8, top = 4, hh = H - 22;
    for (let i = 0; i < seg; i++) { const y = top + hh - (i + 1) * hh / seg + 1, on = i < lit, c = i > 13 ? COL.red : i > 10 ? COL.amber : COL.teal;
      g.fillStyle = on ? c : "#26252b"; g.shadowColor = c; g.shadowBlur = on ? 6 : 0; g.fillRect(x, y, bw, hh / seg - 2); }
    g.shadowBlur = 0; text(g, label, x + bw + 4, top + 8, "#6c6a70", 8); text(g, (db < -60 ? "-∞" : db.toFixed(1)), x - 2, H - 4, "#9a968f", 9);
  });
}
// ===================================================================== AUDIO ENGINE
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const N = (type, opts) => new (window[type])(ctx, opts);
const master = N("GainNode", { gain: 0.9 });
// inside the plugin the page must never make sound itself: its audio engine is only the browser demo
if (HOST) { ctx.suspend(); ctx.close && ctx.close(); } else master.connect(ctx.destination);
const input = N("GainNode");          // every source plugs in here
// ---- DRIVE section
